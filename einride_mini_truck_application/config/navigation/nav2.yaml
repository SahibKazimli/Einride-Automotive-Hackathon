# Nav2 for the mini truck, WITHOUT a map: everything runs in the odom frame
# (from the EKF). Dock positions come from config/docks/*.yaml; the final
# approach uses the AprilTag. Based on nav2_bringup's Jazzy nav2_params.yaml.
#
# Command chain (see launch/navigation.launch.py):
#   controller / behaviors / docking -> cmd_vel_nav -> velocity_smoother
#   -> cmd_vel_smoothed -> collision_monitor (config/safety) -> /cmd_vel

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # ms the BT waits for a server (planner, controller) to accept a goal. The
    # default 20 ms is too short on the busy Jetson: 2026-10-02 every
    # navigation failed with "Timed out ... compute_path_to_pose".
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    # Only used to reach the staging pose in front of a dock; the docking
    # server does the precise part, so this can be loose.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
    # Regulated Pure Pursuit: simple, cheap on the Jetson CPU, turns in place
    # toward the path first (suits skid steering).
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      # Skid steering only reaches ~40 % of a commanded turn rate on this floor
      # (test 1, 2026-10-02), and weak turn commands just scrub the tyres.
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.08   # below ~0.1 m/s the wheels start unevenly
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      # RPP ramps turn-in-place from the robot's MEASURED turn rate. Skid steering
      # does not move at all below ~0.3 rad/s, so with 2.0 it ramped 0 -> 0.1 ->
      # (robot still not turning) 0.1 ... forever: /cmd_vel showed 0.14 rad/s
      # while it sat still (2026-10-03). The velocity smoother still limits
      # acceleration, open loop.
      max_angular_accel: 20.0
      max_robot_pose_search_dist: 10.0

# Robot outline: 0.251 m long (base_footprint centred), ~0.23 m wide.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.13, 0.12], [0.13, -0.12], [-0.13, -0.12], [-0.13, 0.12]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered   # robot body removed, see config/safety/scan_filter.yaml
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The robot's corners reach 0.18 m from its centre; with 0.25 m and a
        # steep falloff (5.0) the planner hugged a bucket so closely that the
        # controller refused the path ("collision ahead", 2026-10-03). A wider,
        # softer cushion keeps paths ~0.3 m clear. Docking itself is steered by
        # the docking server, not this planner, so narrow bays are unaffected.
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

# No map, so the "global" costmap is a bigger rolling window in odom that
# covers the whole 6 x 6 m arena from anywhere inside it.
global_costmap:
  global_costmap:
    ros__parameters:
      # Lidar into the planner's map 3x per second (was 1): obstacles that move
      # into the route, e.g. other robots, show up in the next replan sooner.
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      # Keep "never seen" apart from "seen free" (published as -1): the mission
      # must not pick a staging pose in the lidar shadow behind an obstacle.
      # The planner still plans through unknown (GridBased.allow_unknown).
      track_unknown_space: true
      footprint: "[[0.13, 0.12], [0.13, -0.12], [-0.13, -0.12], [-0.13, 0.12]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered   # robot body removed, see config/safety/scan_filter.yaml
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_is_valid: True      # a max-range beam clears its whole line
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The robot's corners reach 0.18 m from its centre; with 0.25 m and a
        # steep falloff (5.0) the planner hugged a bucket so closely that the
        # controller refused the path ("collision ahead", 2026-10-03). A wider,
        # softer cushion keeps paths ~0.3 m clear. Docking itself is steered by
        # the docking server, not this planner, so narrow bays are unaffected.
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4   # skid steering stalls below ~0.35 rad/s
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.2]
    min_velocity: [-0.4, 0.0, -1.2]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.0, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Docking: drive to a staging pose 0.7 m in front of the dock (via Nav2), then
# servo onto the dock pose computed from the AprilTag (perception/node.py
# publishes /detected_dock_pose; detection offsets are all zero because that
# node already outputs the final docked pose). Undocking backs out to staging.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    # dock_database is set by launch/navigation.launch.py (layout:=home|arena).

    dock_plugins: ['competition_dock']
    competition_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      # Docked once base_footprint is within 3 cm of the dock pose. The scoring
      # window is +-50 mm around the nominal 200 mm gap.
      docking_threshold: 0.015   # was 0.03: first real dock (2026-10-02) ended at a 26 cm gap
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0
      use_external_detection_pose: true
      # Tag detections arrive at only ~1 Hz with the full stack running (CPU);
      # 1.0 s aborted docking between two detections.
      external_detection_timeout: 2.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      use_stall_detection: false

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.08
      v_linear_max: 0.2
      slowdown_radius: 0.25
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 3.0
      # The dock's own walls are obstacles; ignore collisions this close to it.
      dock_collision_threshold: 0.4
