# Dock database for Nav2's docking server: the competition arena.
# Source: einride_mini_truck_gazebo/worlds/arena.sdf (6 x 6 m, origin at the centre).
#
# `pose` is where base_footprint must be when docked: 0.326 m out from the tag
# (front of robot 200 mm from the back wall), facing the tag. `frame: arena`
# is linked to odom by the start pose given at launch (start_x/start_y/start_yaw).
# Only the rough position matters: the final approach uses the tag itself.
docks:
  dock_0:   # A, tag at (+2.992, -1.500)
    type: competition_dock
    frame: arena
    pose: [2.666, -1.500, 0.0]
    id: '0'
