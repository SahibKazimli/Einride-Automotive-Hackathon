    type: competition_dock
    frame: arena
    pose: [2.954, 1.45, 0.0]
    id: '1'
  dock_2:   # C, tag (2.12, 1.40) facing right
    type: competition_dock
    frame: arena
    pose: [2.12, 1.154, 1.5708]
    id: '2'
