# Competition arena, docks measured with tape from the start mark where the
# competition_go_time SLAM map was started (2026-10-09). Frame "arena" = robot
# centre at the start mark: x forward, y left (m). pose = docked robot centre,
# 0.246 m in front of the tag (12 cm gap + 12.6 cm), facing the tag (yaw rad).
# Tag facings are assumed (walls facing into the arena); fix here if wrong.
docks:
  dock_0:   # A, tag (3.20, 0.00) facing back toward the start
    type: competition_dock
    frame: arena
    pose: [2.954, 0.0, 0.0]
    id: '0'
