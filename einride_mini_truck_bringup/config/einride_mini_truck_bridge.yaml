---
# ros_gz_bridge configuration for einride-mini-truck.
# Gazebo-side topic names are set explicitly in the model SDF, so these match 1:1.

# --- clock -------------------------------------------------------------------
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# --- base motion -------------------------------------------------------------
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint, published by the DiffDrive system
- ros_topic_name: "/tf"
  gz_topic_name: "/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# All six wheels plus the two pan-tilt joints.
# gz-sim's JointStatePublisher has no rate parameter and fires every physics step,
# so this lands on /joint_states_raw and the bringup launch throttles it down to
# /joint_states, which is what robot_state_publisher consumes.
- ros_topic_name: "/joint_states_raw"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Only the front wheels are physically instrumented; this is the honest
# proprioceptive stream. /joint_states carries all six for TF purposes.
# SENSOR_DATA, matching qos_profile_sensor_data in ugv02_serial_node.py.
- ros_topic_name: "/wheel_encoders"
  gz_topic_name: "/wheel_encoders"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# --- IMU ---------------------------------------------------------------------
# qos_profile below matches qos_profile_sensor_data, which ugv02_serial_node.py
# publishes these three streams with on hardware. Without the key the bridge
# uses the rclcpp default, which is reliable - and note that a subscriber
# requesting RELIABLE receives nothing at all from a best-effort publisher.
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/mag"
  gz_topic_name: "/mag"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# --- 2D lidar ----------------------------------------------------------------
# Bridged to /scan/raw, not /scan: gz's gpu_lidar gets the scan geometry right
# but not the message semantics the LD19 driver produces (+inf instead of NaN
# for a bin that returned nothing, scan_time and time_increment left at zero,
# intensities flat zero). ld19_scan_model sits on this topic and publishes the
# /scan that everything else consumes. See that node's docstring.
- ros_topic_name: "/scan/raw"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# gz's own /scan/points is deliberately NOT bridged. On hardware /scan/points is
# laserscan_to_pointcloud's view of /scan, and gz's cloud is a different thing
# built straight off the ray cast - a different field layout, and derived from
# the pre-ld19_scan_model ranges, so the two modes disagreed on both content and
# structure. simulation.launch.py now runs the same converter hardware does, off
# the same /scan, which makes the topic identical on both sides by construction.

# --- OAK-D Lite (forward-facing) ------------------------------------------------
# Topic layout follows depthai_ros_driver: /oak/rgb/*, /oak/stereo/*, /oak/points.
#
# gz's own depth cloud, /oak/stereo/image_raw/points, is deliberately NOT bridged.
# Its points are in the link's x-forward/z-up axes but its header names the
# optical frame (z forward, y down), so every consumer drew it rotated - off to
# the side and standing on end - and its rgb field is a grey ramp, not the colour
# camera. simulation.launch.py builds /oak/points with depth_image_proc from the
# depth and colour images below instead, in the optical frame, coloured.
- ros_topic_name: "/oak/rgb/image_raw"
  gz_topic_name: "/oak/rgb/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/rgb/camera_info"
  gz_topic_name: "/oak/rgb/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/stereo/image_raw"
  gz_topic_name: "/oak/stereo/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/stereo/camera_info"
  gz_topic_name: "/oak/stereo/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# The raw OV7251 mono pair, 640x480 mono8 - the stereo INPUT, not a view of the
# depth output above, which is colour-aligned and colour-sized. Hardware publishes
# these because oak_d_lite.yaml sets left/right i_publish_topic.
#
# No qos_profile key, matching the other camera entries: images bridge RELIABLE,
# only the IMU/mag/encoder streams are SENSOR_DATA.
#
# The images match; the camera_info beside them does not, and the interesting part
# is not the obvious bit. No rational_polynomial distortion, and the principal
# point lands at exactly 320/240 against the device's 333.7/257.5 - expected.
#
# The one that bites is P[3], the baseline term. gz has no notion of a stereo pair,
# so it gives each camera -fx * its own lateral offset in the link: measured here
# as -17.089 left and -16.792 right, which is exactly -fx * |pose y| to the micron.
# The real camera instead puts the WHOLE baseline on the left, -33.837, and leaves
# the right at 0. So a consumer reading the simulated left camera_info infers a
# 37.75 mm baseline where the truth is 74.75, and the simulated right disagrees
# with both. stereo_image_proc against the simulated pair is not degraded, it is
# wrong - triangulate from the TF tree instead, which IS correct in both modes.
- ros_topic_name: "/oak/left/image_raw"
  gz_topic_name: "/oak/left/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/left/camera_info"
  gz_topic_name: "/oak/left/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/right/image_raw"
  gz_topic_name: "/oak/right/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/right/camera_info"
  gz_topic_name: "/oak/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/oak/imu/data"
  gz_topic_name: "/oak/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
