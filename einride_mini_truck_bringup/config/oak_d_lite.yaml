---
# depthai_ros_driver parameters for the OAK-D Lite, set so the real camera
# matches the simulated one. Used by hardware.launch.py, selected by default
# (camera_config:=rgbd) or explicitly.
#
# THE RGBD/RGBSTEREO SPLIT
# -------------------------
# This is one of two sibling configs; the other is oak_d_lite_rgbstereo.yaml
# (camera_config:=rgbstereo). They exist because the OAK-D Lite's XLink link
# cannot carry the full RGB + left + right + depth + IMU set at once: with all
# four camera streams enabled, the IMU's device-side queue is starved
# indefinitely and /oak/imu/data is silent - not a race, not a timing issue,
# reproducible every time. See OAK_IMU_INVESTIGATION.md, "Root cause: IMU
# starved by the full RGBD pipeline".
#
# This file is RGB + depth (i_pipeline_type: RGBD) with left/right raw
# publishing turned OFF - that frees enough bandwidth for the IMU to stream
# normally alongside RGB and depth. oak_d_lite_rgbstereo.yaml instead keeps
# left/right raw and drops depth. Pick whichever pair of streams the task
# needs; the IMU works in both, RGB works in both, but depth and raw
# left/right are mutually exclusive on this device.
#
# Every value here was verified against the physical camera; see
# docs/camera.md for the measurements.
#
# WHY 1280x720 AND NOT 1052x780
# -----------------------------
# An earlier version of this file asked for the sensor's native 4208x3120
# ISP-scaled by 1/4, giving 1052x780, to preserve the native 1.3487 aspect and
# so the full 69/54 degree field of view. The real device rejects it:
#
#   ISP scaling with num: 1 and den: 4 results in width: 1052 and height: 780
#   which are not divisible by 16.
#   StereoDepth: Custom disparity/depth width must be multiple of 16.
#
# Depth-to-colour alignment requires both output dimensions to be multiples of
# 16, and no ISP fraction of the full sensor can satisfy that: 4208 = 16*263 and
# 3120 = 16*195, so a scale of num/den only lands on a multiple of 16 when den
# divides num, i.e. never for a downscale. 13MP is therefore usable only at full
# resolution, which is far beyond the USB budget.
#
# What works instead is the 1080P sensor mode ISP-scaled by 2/3: 1920x1080 ->
# 1280x720, and 1280 and 720 both divide by 16 where 1080 does not. 1080P is a
# full-width, vertically cropped readout, so measured HFOV is 69.85 deg -
# identical to the full sensor - and only the vertical field is reduced, from
# 54.76 to 42.90 deg. On this robot the camera sits 0.10 m up looking level, so
# that costs about 6 cm of near-ground visibility (first ground return moves from
# 0.20 m to 0.26 m ahead) and nothing else. That is the price of aligned depth,
# and it is worth paying: colour and depth then share one optical frame, one
# resolution and one set of intrinsics, which is what model.sdf assumes.
/oak:
  ros__parameters:
    camera:
      # Confirmed present on the real device despite the OAK-D Lite commonly
      # being documented as having no IMU: getConnectedIMU() reports BMI270 and
      # the device streams accel + gyro. Simulation publishes /oak/imu/data, so
      # hardware must too.
      #
      # Set under BOTH namespaces deliberately. depthai_ros_driver 2.12.2 builds
      # from 2026-09-11 onward dropped camera.i_enable_imu and read
      # pipeline_gen.i_enable_imu instead; earlier builds of the same version
      # number have camera.i_enable_imu as the live key. The robot and this
      # workstation are on opposite sides of that change. An unknown parameter
      # in a params file is ignored rather than rejected, so naming both is
      # safe and works on either build. On the newer build the camera. key is a
      # silent no-op and the IMU runs only because pipeline_gen defaults to
      # true, so this is insurance against that default changing.
      i_enable_imu: true
      # RGB + depth, no left/right raw. Stated explicitly even though it is
      # this pipeline generator's own default - see the header comment above
      # for why this and oak_d_lite_rgbstereo.yaml cannot both be true at once.
      i_pipeline_type: RGBD
      # The OAK-D Lite has no IR dot projector and no floodlight. Leaving the
      # driver default of true asks a device with no such hardware to drive it.
      i_enable_ir: false
      i_nn_type: none
      # TF for everything INSIDE the camera comes from the device's own EEPROM
      # calibration, not from model.sdf. The description still owns where the
      # camera body is mounted (oak_d_lite_link); the device owns the geometry
      # between its own sensors, because only it knows which physical camera is
      # bolted on. Measured on mxid 194430107146157E00: the mono baseline is
      # 74.75 mm where the description's nominal figure was 75.
      #
      # This publishes six frames - oak_{rgb,left,right}_camera_frame and their
      # _camera_optical_frame children - so model.sdf must NOT declare any of
      # them. It did declare oak_rgb_camera_optical_frame; that link was removed
      # in the same commit as this. Two publishers for one child frame is not an
      # error anybody reports: tf2's static cache is keyed by child and simply
      # overwrites, and /tf_static is latched, so which one a given subscriber
      # believes depends on message arrival order.
      i_publish_tf_from_calibration: true
      # The frame the driver's socket chain hangs off. model.sdf declares a link
      # of exactly this name, identity to oak_d_lite_link, purely to receive it.
      #
      # MUST BE SPELLED LIKE THE NODE, i.e. 'oak'. This parameter does double
      # duty once the flag above is on: sensor_helpers.cpp::tfPrefix returns it
      # as the prefix for every image frame_id, while TFPublisher names the
      # frames it PUBLISHES after the node instead. Set this to oak_d_lite_link -
      # which is geometrically the right answer and was tried on the robot - and
      # the images come out stamped oak_d_lite_link_left_camera_optical_frame
      # while TF carries oak_left_camera_optical_frame. Nothing warns; every
      # image simply sits in a frame that does not exist.
      #
      # The attachment is exact rather than approximate. The socket whose
      # extrinsics point nowhere (toCameraSocket == -1) is bolted to this frame
      # with an identity transform, and on this device that socket is CAM_A, the
      # colour camera - which model.sdf places at oak_d_lite_link's origin,
      # rotated by exactly the -pi/2, 0, -pi/2 the driver hardcodes.
      #
      # If a future device roots its chain at CAM_B or CAM_C instead, this
      # silently redefines the camera origin as that mono camera's centre and
      # shifts the whole assembly ~37 mm. Re-check the dump's toCameraSocket
      # fields rather than assuming; test_oak_calibration_tf.py asserts it.
      i_tf_base_frame: oak
      # Inert: it is only used for a URDF the driver hands to a node called
      # oak_state_publisher, which this launch never starts. Stated honestly
      # anyway rather than left at the stock 'oak-d-base-frame'.
      i_tf_parent_frame: base_link
      # A BUG WORKAROUND, not a preference - do not "tidy" this back to false.
      #
      # True means "the IMU frame comes from the description", which suppresses
      # publishImuTransform entirely. It has to, because that function is wrong:
      # quatFromRotM computes q_rot2rdf * q_extr * q_rot2rdf^-1, a similarity
      # transform. That is right for camera-to-camera, where both frames are
      # optical and both need re-basing, and wrong for camera-to-IMU, where the
      # child is not an optical frame and only the left factor belongs. The
      # result is off by exactly one q_rot2rdf, i.e. 2*acos(0.5) = 120 degrees.
      #
      # Measured on the device, expressing the IMU axes in the robot's FLU frame:
      #   model.sdf   imu_x = right,  imu_y = forward,  imu_z = up
      #   the driver  imu_x = up,     imu_y = left,     imu_z = back
      # The first is what docs/imu.md documents from the physical device, so
      # model.sdf keeps oak_imu_frame and the driver stays out of it. Note the
      # translations agree to 0.000 mm; only the rotation is affected.
      i_tf_imu_from_descr: 'true'
    pipeline_gen:
      i_enable_imu: true          # see camera.i_enable_imu above
    rgb:
      # 1080P, not 720P. The IMX214 does not support a 720P sensor mode - asking
      # for one logs
      #   Resolution 720P not supported by sensor IMX214. Using default
      #   resolution 1080P
      # on every boot and then falls back here anyway. The output was always
      # correct, because i_width/i_height below ISP-scale 1920x1080 down by 2/3,
      # but a config that only works via a fallback path is a config that lies
      # about what the sensor is doing. Naming the real mode makes the warning
      # go away and changes nothing else: verified on the robot, byte-identical
      # camera_info (1280x720, fx 916.60, HFOV 69.85, VFOV 42.90).
      #
      # 1080P is also the only sensor mode that survives the multiple-of-16 rule
      # depth alignment imposes: 1920x1080 scaled 2/3 gives 1280x720, and both
      # 1280 and 720 divide by 16. 1080 itself does not, which is why the ISP
      # scale rather than the raw sensor mode is what reaches the topic.
      i_resolution: 1080P
      # Must be stated explicitly. The driver derives camera_info from
      # i_width/i_height, so leaving them at a value the sensor does not
      # actually produce yields a camera_info that does not match the image.
      i_width: 1280
      i_height: 720
      i_fps: 30.0
    # The two OV7251 mono sensors that feed stereo depth. i_publish_topic is
    # left at the driver's own default (false) here - NOT set to true, unlike
    # oak_d_lite_rgbstereo.yaml. Confirmed on the robot: with i_pipeline_type
    # RGBD, publishing /oak/left/image_raw and /oak/right/image_raw alongside
    # RGB and depth is exactly what starves the IMU's XLink queue. Dropping
    # these two raw streams - not the depth stream, which is what a first guess
    # would suspect - is what makes /oak/imu/data flow again. StereoDepth still
    # gets both mono feeds directly on-device either way; only the extra raw
    # publish is removed. See OAK_IMU_INVESTIGATION.md.
    left:
      i_publish_topic: false
    right:
      i_publish_topic: false
    stereo:
      i_resolution: 480P          # 640x480 OV7251 pair, 75 mm baseline
      # Depth is aligned to the colour camera, so the published depth image is
      # colour-sized and carries the colour intrinsics. These must therefore
      # match the rgb block above, not the 640x480 the mono pair produces.
      i_align_depth: true
      i_width: 1280
      i_height: 720
      i_fps: 30.0
      i_subpixel: true
      # Luxonis' own preset for "navigation and obstacle detection, without
      # motion blur". Without it the driver runs HIGH_ACCURACY, whose threshold
      # filter has maxRange 65535 mm and whose spatial, speckle and temporal
      # filters are all off - which on this camera publishes depth up to
      # 65.535 m indoors (uint16 saturation), 1 pixel in 1000 claiming beyond
      # 50 m on a sensor whose usable range ends at 19. ROBOTICS enables the
      # spatial (delta 20, hole-fill 2) and speckle (range 200) filters and
      # clamps output to 0-10 m. Measured here: valid pixels 64.4% -> 59.3%,
      # and the 50 m+ phantom returns disappear entirely. On a robot in a
      # 6x6 m arena, whose diagonal is 8.5 m, the 10 m clamp costs nothing.
      #
      # Its decimation factor of 2 does NOT change the published size - depth
      # still comes out colour-aligned at 1280x720, verified on the device - but
      # it does mean disparity is computed at half resolution and upsampled, so
      # fine detail is coarser than the pixel count suggests.
      #
      # NOTE: the preset is applied below the ROS parameter layer and is
      # invisible to `ros2 param get` - i_stereo_conf_threshold and every
      # i_enable_*_filter read the same under any preset. The enable flags are
      # enable-ONLY: leaving them false does not switch off what the preset
      # turned on. Confirm with camera.i_pipeline_dump:=true, which writes the
      # exact StereoDepth config sent to the device to
      # /tmp/<device-id>_pipeline.json.
      i_depth_preset: ROBOTICS
      # The two settings the driver would otherwise apply ON TOP of the preset,
      # pinned back to the preset's own values. Confirmed necessary from a
      # pipeline dump: without these the device ran median 5 and confidence 240
      # while every other ROBOTICS value came through intact.
      i_depth_filter_size: 7        # KERNEL_7x7; the driver default 5 overrides
      i_stereo_conf_threshold: 245  # preset value; the driver default is 240
    imu:
      # The driver default is 400 Hz, which this device does not reach: the
      # merged accel + gyro stream tops out near 250 Hz. 100 Hz matches the
      # update_rate the simulated BMI270 is declared at.
      i_acc_freq: 100
      i_gyro_freq: 100
      i_message_type: IMU
